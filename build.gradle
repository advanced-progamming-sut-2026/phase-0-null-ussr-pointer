plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'pmd'
}

group = 'com.team'
version = '1.0-SNAPSHOT'

ext {
    gdxVersion = '1.12.1'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

checkstyle {
    toolVersion = '13.7.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

pmd {
    toolVersion = '7.16.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/pmd.xml')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.withType(Pmd).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

dependencies {

    // ---------- Your existing libraries ----------
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'com.github.pizpizi:libPVZ:v0.1.3'
    implementation 'com.github.pizpizi:pvz-skin:v0.1.0'
    implementation 'com.github.raeleus.TenPatch:tenpatch:5.2.3'

    // ---------- LibGDX ----------
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // Desktop backend (LWJGL3)
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    // Desktop natives
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    // ---------- Tests ----------
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.15.2'
}

application {
    mainClass = 'Main'
}

run {
    standardInput = System.in

    // Same JVM args libPVZ uses
    jvmArgs(
            '--enable-native-access=ALL-UNNAMED',
            '-Dorg.lwjgl.system.JNINativeInterfaceSize=233'
    )

    systemProperties System.getProperties()
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

tasks.named("check") {
    dependsOn.clear()
    dependsOn(
            tasks.named("checkstyleMain"),
            tasks.named("pmdMain")
    )
}